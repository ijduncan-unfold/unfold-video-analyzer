name: Application checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/checks.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'integrations/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-desktop.txt'
      - 'pytest.ini'
  pull_request:

permissions:
  contents: read

concurrency:
  group: application-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test backend, media and exports
        run: python -m pytest -q
      - name: Test editor integrations
        run: |
          node --test integrations/premiere/tests/*.test.cjs
          node --test integrations/resolve/tests/*.test.cjs
      - name: Install frontend
        run: npm --prefix frontend ci
      - name: Check frontend
        run: npm --prefix frontend test && npm --prefix frontend run build && npm --prefix frontend run lint
