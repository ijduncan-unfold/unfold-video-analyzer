<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'" />
  <title>Video Analyzer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header><h1>Video Analyzer</h1><button id="connection-toggle" class="quiet" aria-expanded="true" type="button">Connection</button></header>
    <section id="connection" aria-label="Local connection">
      <label for="server">Local service</label><input id="server" type="text" autocomplete="off" spellcheck="false" />
      <label for="token">Editor pairing code</label><input id="token" type="password" autocomplete="off" placeholder="Paste from the companion app" />
      <div class="row"><button id="connect" class="primary" type="button">Connect</button><button id="disconnect" type="button" disabled>Disconnect</button></div>
      <p class="hint">Open the companion app. In Settings, copy the editor pairing code.</p>
    </section>
    <p id="message" role="status" aria-live="polite">Connect to your local analyzer to begin.</p>
    <section id="workspace" hidden>
      <p id="project-name" class="project"></p>
      <button id="load-selection" class="full" type="button">Load selected Media Pool clips</button>
      <button id="asset-toggle" class="full asset-toggle" type="button" aria-expanded="false">Choose a clip</button>
      <section id="asset-picker" hidden aria-label="Clips in this Resolve project">
        <input id="asset-search" type="search" placeholder="Search clips" aria-label="Search clips in this Resolve project" />
        <div id="asset-list" role="list"></div>
      </section>
      <div class="row analysis"><select id="mode" aria-label="Analysis type"><option value="flash_only">Shots and tags</option><option value="flash_pro">Full analysis</option></select><button id="analyze" type="button" class="primary" disabled>Analyze</button></div>
      <p id="progress" class="hint" role="status" aria-live="polite"></p>
      <div class="tabs" role="tablist" aria-label="Analysis results"><button id="shots-tab" role="tab" type="button" aria-selected="true" aria-controls="results">Shots</button><button id="transcript-tab" role="tab" type="button" aria-selected="false" aria-controls="results">Transcript</button></div>
      <input id="search" type="search" aria-label="Search shots" placeholder="Search shots, tags, composition…" maxlength="500" />
      <div class="row tools"><p id="result-count" class="hint"></p><button id="add-markers" type="button" disabled>Add source markers</button></div>
      <p class="hint timing">Times start at the beginning of the original media. Select a clip in Resolve, or copy its times. Exact source-viewer seeking is not available.</p>
      <div id="results" role="tabpanel" aria-labelledby="shots-tab"></div>
      <button id="show-more" type="button" class="full" hidden>Show more</button>
      <footer class="row"><button id="export-subtitles" type="button" hidden>Export SRT</button><button id="open-analyzer" type="button" class="quiet">Open full analyzer</button></footer>
    </section>
  </main>
  <script src="controller.js"></script>
  <script src="panel.js"></script>
</body>
</html>
